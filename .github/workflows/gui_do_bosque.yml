name: Gui do Bosque Code Reviewer 🌳

on:
  pull_request:
    types: [opened, synchronize, review_requested] 

permissions:
  id-token: write      
  contents: read       
  pull-requests: write 

jobs:
  review:

    if: |
      github.event.requested_team.slug == 'gui-do-bosque' ||
      contains(github.event.pull_request.requested_teams.*.slug, 'gui-do-bosque')
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth google-genai

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/620861699805/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gui-do-bosque@mapa-da-segregacao.iam.gserviceaccount.com'

      - name: Run Gui do Bosque Reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python config/gui_bot_script.py

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GUI_BOT_APP_ID }}
          private-key: ${{ secrets.GUI_BOT_PRIVATE_KEY }}

      - name: Post Comment on PR
        if: hashFiles('review_output.md') != ''
        uses: mshick/add-pr-comment@v2
        with:
          repo-token: ${{ steps.generate-token.outputs.token }}
          message-path: review_output.md
          
      - name: Print Review to Logs
        run: cat review_output.md