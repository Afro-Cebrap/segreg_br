name: Build Gui do Bosque Knowledge Base 🌳📚

on:
  workflow_dispatch:           # acionamento manual
  schedule:
    - cron: '0 6 * * 1'        # toda segunda-feira, 06:00 UTC

permissions:
  contents: write       # para criar a branch do PR
  pull-requests: write  # para abrir o PR
  id-token: write       # Workload Identity Federation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GUI_BOT_APP_ID }}
          private-key: ${{ secrets.GUI_BOT_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade google-api-python-client google-auth "google-genai>=1.51.0" pypdf

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/620861699805/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'gui-do-bosque@mapa-da-segregacao.iam.gserviceaccount.com'

      - name: Build knowledge base
        env:
          GOOGLE_CLOUD_PROJECT: 'mapa-da-segregacao'
          GOOGLE_CLOUD_LOCATION: 'global'
          GEMINI_MODEL: 'gemini-3.1-pro-preview'
        run: |
          python config/build_knowledge_base.py

      - name: Open PR with updated knowledge base
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: config/guidelines_cache.md
          branch: chore/gui-do-bosque-kb
          delete-branch: true
          commit-message: "chore: atualiza base de conhecimento do Gui do Bosque 🌳📚"
          title: "chore: atualiza base de conhecimento do Gui do Bosque 🌳📚"
          body: |
            Atualização automática da base de conhecimento destilada
            (`config/guidelines_cache.md`), gerada a partir do Drive.

            **Revise o digest antes de mesclar** — é um resumo por LLM; pode ser
            corrigido à mão neste PR.
